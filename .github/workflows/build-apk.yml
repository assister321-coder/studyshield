name: Build StudyShield APK

on:
  workflow_dispatch:
  push:
    paths: ['StudyShieldAndroid/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK; just accept licenses.
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build debug APK
        working-directory: StudyShieldAndroid
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StudyShield-debug-apk
          path: StudyShieldAndroid/app/build/outputs/apk/debug/app-debug.apk
